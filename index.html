<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Screensaver Scenes</title>
<style>
  :root { --bg: #111318; --card: #1b1e26; --text: #eceef3; --muted: #9aa0ad; --line: #2a2e38; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; padding: 24px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
  header, main { max-width: 1200px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 24px; margin: 0; }
  header p { color: var(--muted); margin: 0; width: 100%; }
  .btn { color: var(--text); background: var(--card); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; text-decoration: none; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  a.tile { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; color: inherit; text-decoration: none; }
  a.tile:hover, a.tile:focus-visible { border-color: #6b7385; outline: none; }
  a.tile img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
  .meta { padding: 10px 12px; display: flex; justify-content: space-between; gap: 8px; }
  .tags { color: var(--muted); font-size: 13px; }
  #err { color: #ffb4b4; }
</style>
</head>
<body>
<header>
  <h1>TV Screensaver Scenes</h1>
  <a class="btn" href="play.html?exit=0&amp;interval=8">Play all</a>
  <p id="sub">Silent, animated scenes drawn in code. Click one to watch it full screen; Left and Right switch scenes there.</p>
</header>
<main id="grid"><p id="err"></p></main>
<script>
(async () => {
  try {
    const m = await (await fetch('manifest.json')).json();
    document.getElementById('sub').textContent = `${m.scenes.length} silent, animated scenes drawn in code (version ${m.version}). Click one to watch it full screen; Left and Right switch scenes there.`;
    const grid = document.getElementById('grid'); grid.innerHTML = '';
    for (const s of m.scenes) {
      const a = document.createElement('a');
      a.className = 'tile'; a.href = `play.html?exit=0&scenes=${encodeURIComponent(s.id)}`;
      const img = document.createElement('img'); img.src = s.thumb; img.alt = ''; img.loading = 'lazy';
      const meta = document.createElement('div'); meta.className = 'meta';
      const name = document.createElement('span'); name.textContent = s.name;
      const tags = document.createElement('span'); tags.className = 'tags'; tags.textContent = s.tags.join(' · ');
      meta.append(name, tags); a.append(img, meta); grid.appendChild(a);
    }
  } catch (e) { document.getElementById('err').textContent = "Couldn't load manifest.json: " + e.message; }
})();
</script>
</body>
</html>
