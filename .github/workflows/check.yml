name: Check scenes

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Manifest matches the files (hashes, ids, thumbnails)
        run: node tools/build-manifest.js --check
      - name: Every scene runs without errors
        run: node tools/check.js
